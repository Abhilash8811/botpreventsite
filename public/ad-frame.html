<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advertisement</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div id="ad-slot" style="display:flex; justify-content:center; align-items:center; width:100%; height:100%;"></div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const key = params.get('key');
      const w = parseInt(params.get('w') || '300', 10);
      const h = parseInt(params.get('h') || '250', 10);

      if (!key) return;

      window.atOptions = {
        'key': key,
        'format': 'iframe',
        'height': h,
        'width': w,
        'params': {}
      };

      const container = document.getElementById('ad-slot');
      const script = document.createElement('script');
      script.type = 'text/javascript';
      script.src = 'https://www.highrevenueformat.com/' + key + '/invoke.js';
      container.appendChild(script);
    })();
  </script>
</body>
</html>
