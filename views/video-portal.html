<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoHub - Trending Videos</title>
  <link rel="stylesheet" href="/css/yt-style.css">
</head>
<body>
  <!-- Header -->
  <header class="yt-header">
    <a href="/monetized" class="yt-logo" onclick="location.hash=''; location.reload(); return false;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21.58 7.19a2.76 2.76 0 0 0-1.95-1.96C17.9 4.75 12 4.75 12 4.75s-5.9 0-7.63.48A2.76 2.76 0 0 0 2.42 7.2 28.8 28.8 0 0 0 2 12a28.8 28.8 0 0 0 .42 4.81 2.76 2.76 0 0 0 1.95 1.96c1.73.48 7.63.48 7.63.48s5.9 0 7.63-.48a2.76 2.76 0 0 0 1.95-1.96 28.8 28.8 0 0 0 .42-4.81 28.8 28.8 0 0 0-.42-4.81zM9.75 15.02V8.98l5.5 3.02-5.5 3.02z"/>
      </svg>
      <span>VideoHub</span>
    </a>

    <div class="yt-search-container">
      <input type="text" id="searchInput" class="yt-search-input" placeholder="Search videos..." oninput="onSearchInput(this.value)">
      <button class="yt-search-btn" onclick="onSearchInput(document.getElementById('searchInput').value)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
    </div>

    <div style="font-size: 13px; color: #10b981; font-weight: 600; display: flex; align-items: center; gap: 6px;">
      <span style="width: 8px; height: 8px; background: #10b981; border-radius: 50%;"></span>
      HD Stream
    </div>
  </header>

  <!-- 100VH HEAVY AD WALL (First Viewport Packed With Ads) -->
  <section class="hero-ad-wall" id="hero-ad-wall">
    <!-- Top 728x90 Leaderboard -->
    <div class="ad-top-wrapper">
      <div id="ad-slot-728"></div>
    </div>

    <!-- Center Ad Arena (Left Skyscraper + Center Stack + Right Skyscraper) -->
    <div class="ad-arena-grid">
      <!-- Left 160x600 Wide Skyscraper (Desktop) -->
      <div class="ad-side-pillar">
        <div id="ad-slot-160x600"></div>
      </div>

      <!-- Center Heavy Ad Stack -->
      <div class="ad-center-stack">
        <!-- 468x60 Banner -->
        <div id="ad-slot-468x60"></div>

        <!-- 300x250 Medium Rectangle -->
        <div id="ad-slot-300x250"></div>

        <!-- Native Multi-Card Banner -->
        <div id="native-banner-hero" style="width: 100%; min-height: 140px;"></div>
      </div>

      <!-- Right 160x300 Skyscraper (Desktop) -->
      <div class="ad-side-pillar">
        <div id="ad-slot-160x300"></div>
      </div>
    </div>

    <!-- Scroll Down Prompt -->
    <div class="scroll-indicator" onclick="scrollToVideos()">
      <span>Scroll Down For Videos</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
    </div>
  </section>

  <!-- Category Filter Chips (Sticky) -->
  <div class="yt-chips-bar" id="chips-bar"></div>

  <!-- Main Container -->
  <div class="yt-container">
    <!-- Browse View (Video Grid + Pagination) -->
    <div id="browse-view">
      <div class="yt-grid" id="video-grid">
        <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #888;">
          Loading verified video library...
        </div>
      </div>

      <!-- Numbered Pagination Controls -->
      <div class="pagination-container" id="pagination"></div>
    </div>

    <!-- Watch View (Player + Sidebar) -->
    <div id="watch-view" class="yt-watch-layout" style="display: none;">
      <div class="yt-player-column">
        <div class="yt-player-container">
          <video id="main-player" controls preload="metadata" playsinline></video>
        </div>
        <h1 class="yt-watch-title" id="watch-title">Video Title</h1>
        <div class="yt-watch-bar">
          <span class="yt-submeta" id="watch-views">1.2M views</span>
          <div class="yt-action-btns">
            <button class="yt-action-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
              Like
            </button>
            <button class="yt-action-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
              Share
            </button>
            <button class="yt-action-btn" onclick="location.hash=''; checkRoute();">
              &larr; Back to Grid
            </button>
          </div>
        </div>
      </div>

      <div class="yt-sidebar-column">
        <!-- Sidebar 300x250 Ad -->
        <div style="margin-bottom: 20px; display: flex; justify-content: center;">
          <div id="watch-sidebar-ad"></div>
        </div>

        <h3 style="font-size: 15px; margin-bottom: 12px; color: #fff;">Up Next</h3>
        <div id="recommended-list"></div>
      </div>
    </div>
  </div>

  <!-- Sticky Bottom Mobile Banner (320x50) -->
  <div class="sticky-bottom-banner">
    <div id="sticky-mobile-banner"></div>
  </div>

  <!-- Publisher Compliance & Legal Footer -->
  <footer class="site-footer">
    <div class="footer-links">
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Service</a>
      <a href="/dmca">DMCA Notice</a>
      <a href="/2257">18 U.S.C. 2257 Statement</a>
      <a href="/contact">Contact / Abuse Desk</a>
    </div>
    <div>&copy; 2026 VideoHub. All rights reserved. Indexed external media player.</div>
  </footer>

  <script src="/js/yt-portal.js"></script>
</body>
</html>
