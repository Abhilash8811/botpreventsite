<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact & Abuse Desk - VideoHub</title>
  <link rel="stylesheet" href="/css/yt-style.css">
  <style>
    .legal-content {
      max-width: 680px;
      margin: 40px auto;
      padding: 30px;
      background: #181818;
      border: 1px solid #282828;
      border-radius: 12px;
      line-height: 1.8;
      color: #ccc;
    }
    .legal-content h1 { color: #fff; font-size: 24px; margin-bottom: 12px; }
    .legal-content p { margin-bottom: 20px; font-size: 14px; }
    .form-box { display: flex; flex-direction: column; gap: 14px; }
    input, textarea {
      width: 100%;
      background: #101010;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input:focus, textarea:focus { border-color: #38bdf8; }
    button.send-btn {
      background: #e11d48;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }
    button.send-btn:hover { background: #be123c; }
  </style>
</head>
<body>
  <header class="yt-header">
    <a href="/monetized" class="yt-logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M21.58 7.19a2.76 2.76 0 0 0-1.95-1.96C17.9 4.75 12 4.75 12 4.75s-5.9 0-7.63.48A2.76 2.76 0 0 0 2.42 7.2 28.8 28.8 0 0 0 2 12a28.8 28.8 0 0 0 .42 4.81 2.76 2.76 0 0 0 1.95 1.96c1.73.48 7.63.48 7.63.48s5.9 0 7.63-.48a2.76 2.76 0 0 0 1.95-1.96 28.8 28.8 0 0 0 .42-4.81 28.8 28.8 0 0 0-.42-4.81zM9.75 15.02V8.98l5.5 3.02-5.5 3.02z"/></svg>
      <span>VideoHub</span>
    </a>
  </header>

  <div class="legal-content">
    <h1>Contact & Content Abuse Desk</h1>
    <p>Please submit inquiries, DMCA notices, or technical feedback using the form below:</p>

    <form class="form-box" onsubmit="event.preventDefault(); alert('Your message has been submitted. Our compliance desk responds within 24 hours.'); this.reset();">
      <input type="text" placeholder="Your Name or Organization" required>
      <input type="email" placeholder="Your Email Address" required>
      <input type="text" placeholder="Subject (e.g. DMCA Takedown, Inquiry)" required>
      <textarea rows="5" placeholder="Detailed message, including any specific video URLs..." required></textarea>
      <button type="submit" class="send-btn">Submit Request</button>
    </form>
  </div>
</body>
</html>
